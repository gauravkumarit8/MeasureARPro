[versions]
# AGP 8.9.1 is Google's documented minimum for compileSdk 36; pinned to 8.12.0
# (latest stable 8.x) to get compileSdk 36 as an officially supported target
# rather than just a compatibility warning, while avoiding AGP 9.0's breaking
# DSL changes (built-in Kotlin, removal of the org.jetbrains.kotlin.android
# plugin) — that migration is a separate, deliberate decision for later.
agp = "8.12.0"
kotlin = "2.0.21"
coreKtx = "1.13.1"
lifecycle = "2.8.6"
activityCompose = "1.9.2"
composeBom = "2024.09.03"
navigationCompose = "2.8.1"
# ARCore 1.45.0+ recompiled its native libraries with 16 KB page-size alignment
# (Android 15+ requirement, enforced by Play Console since late 2025). 1.44.0
# predates that fix and would trigger the same "does not support 16 KB" console
# warning as the sqlcipher libraries did in your other app.
arcore = "1.45.0"
# SceneView wraps Filament; verify its shipped native libs pass Play Console's
# 16 KB page-size check when you first build a release bundle — bump to
# whatever's current if the console flags it, same as the ARCore note above.
sceneview = "2.2.1"
room = "2.6.1"
billing = "7.1.1"
playServicesAds = "23.4.0"
userMessagingPlatform = "3.0.0"
zxing = "4.3.0"
ksp = "2.0.21-1.0.28"
coroutines = "1.9.0"

[libraries]
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
arcore = { group = "com.google.ar", name = "core", version.ref = "arcore" }
sceneview = { group = "io.github.sceneview", name = "arsceneview", version.ref = "sceneview" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
billing-ktx = { group = "com.android.billingclient", name = "billing-ktx", version.ref = "billing" }
play-services-ads = { group = "com.google.android.gms", name = "play-services-ads", version.ref = "playServicesAds" }
user-messaging-platform = { group = "com.google.android.ump", name = "user-messaging-platform", version.ref = "userMessagingPlatform" }
zxing-embedded = { group = "com.journeyapps", name = "zxing-android-embedded", version.ref = "zxing" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
